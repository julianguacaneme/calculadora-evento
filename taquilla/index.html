<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Taquilla</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@600;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=6">
  <link rel="stylesheet" href="taquilla.css?v=4">
</head>

<body>
  <nav class="main-nav">
    <button class="nav-btn active" data-target="section-registrar">Registrar Entrada</button>
    <button class="nav-btn" data-target="section-escanear">Preventa (QR)</button>
    <button class="nav-btn" data-target="section-resumen">Resumen</button>
  </nav>

  <main id="app-container">
    <!-- SECCIÓN REGISTRAR -->
    <div id="section-registrar" class="view-section active">
      <h1>Panel de Taquilla</h1>

      <div class="taq-panel">
        <div class="taq-col">
          <h3 class="taq-subtitulo">Personas</h3>
          <div id="tecladoCantidad" class="taq-teclado"></div>
        </div>
        <div class="taq-col">
          <h3 class="taq-subtitulo">Medio de pago</h3>
          <div class="taq-medios">
            <button class="taq-medio medio-efectivo" data-medio="Efectivo" disabled>Efectivo</button>
            <button class="taq-medio medio-breb" data-medio="Bre-B" disabled>Llave Bre-B</button>
            <button class="taq-medio medio-nequi" data-medio="Nequi" disabled>Nequi</button>
            <button class="taq-medio medio-daviplata" data-medio="Daviplata" disabled>Daviplata</button>
            <button class="taq-medio medio-datafono" data-medio="Datáfono" disabled>Datáfono</button>
          </div>
        </div>
      </div>

      <div class="taq-display">
        <span class="taq-display-label">Personas a registrar</span>
        <span id="cantidadDisplay" class="taq-display-num">-</span>
        <span id="totalCobrar" class="taq-display-total"></span>
      </div>
      <button id="btnLimpiar" class="taq-btn-secundario">Limpiar selección</button>

      <div class="taq-precio">
        <label for="precioCover">Precio por persona (cover)</label>
        <input type="number" id="precioCover" inputmode="numeric" min="0" step="1000" placeholder="Ej: 30000">
      </div>

      <div id="feedbackMessage" class="feedback-message" style="display:none;" role="alert"></div>
    </div>

    <!-- SECCIÓN ESCANEAR (boletas de preventa) -->
    <div id="section-escanear" class="view-section">
      <h1>Boletas de preventa</h1>

      <form id="esc-login" class="esc-login" style="display:none;">
        <label for="esc-pin">PIN de la puerta</label>
        <input type="password" id="esc-pin" inputmode="numeric" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
        <div id="esc-login-feedback" class="feedback-message error" style="display:none;" role="alert"></div>
      </form>

      <div id="esc-app" style="display:none;">
        <div class="esc-barra">
          <select id="esc-evento" aria-label="Evento"></select>
          <button type="button" id="esc-actualizar" class="taq-btn-secundario">Actualizar</button>
        </div>
        <p id="esc-estado" class="esc-estado"></p>

        <div id="esc-resultado" class="esc-resultado" style="display:none;"></div>

        <div id="esc-lector" class="esc-lector"></div>
        <button type="button" id="esc-camara">Escanear QR</button>

        <label for="esc-buscar">Buscar sin QR (nombre, cédula o código)</label>
        <input type="text" id="esc-buscar" autocomplete="off">
        <div id="esc-busqueda" class="esc-busqueda"></div>

        <p id="esc-progreso" class="esc-progreso"></p>
        <button type="button" id="esc-salir" class="taq-btn-secundario esc-salir">Cerrar sesión de la puerta</button>
      </div>
    </div>

    <!-- SECCIÓN RESUMEN -->
    <div id="section-resumen" class="view-section">
      <h2>Resumen de Entradas</h2>

      <div class="taq-stats">
        <div class="taq-stat taq-stat-total">
          <span class="taq-stat-titulo">Total recaudado</span>
          <span id="statRecaudado" class="taq-stat-valor"></span>
          <span id="statPersonas" class="taq-stat-sub"></span>
        </div>
        <div id="statsPorMedio" class="taq-stats-medios"></div>
      </div>

      <div class="taq-acciones">
        <button id="btnExportarCSV" class="taq-btn-secundario">Exportar CSV</button>
        <button id="btnNuevoEvento" class="btn-delete">Iniciar nuevo evento</button>
      </div>

      <div class="table-responsive">
        <table id="registrosTable" class="data-table">
          <thead>
            <tr>
              <th>Hora</th>
              <th>Personas</th>
              <th>Medio</th>
              <th>Total</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="registros-feedback" class="empty-state">No hay registros de entrada todavía.</div>
    </div>
  </main>

  <script src="../storage.js?v=6"></script>
  <script src="taquilla.js?v=1"></script>
  <script src="../lib/html5-qrcode.min.js"></script>
  <script src="../lib/preventa-api.js?v=2"></script>
  <script src="escaner.js?v=1"></script>
</body>

</html>
